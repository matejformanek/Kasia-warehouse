name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege per context/decisions/0105-infra-security-hardening.md:
# nothing at the top level, each job asks for what it needs. Third-party
# actions are pinned by commit SHA (tag in the trailing comment).
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: kasia
          POSTGRES_USER: kasia
          POSTGRES_PASSWORD: kasia
        options: >-
          --health-cmd "pg_isready -U kasia -d kasia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://kasia:kasia@localhost:5432/kasia
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DEBUG: "0"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: latest

      - name: Pin Python
        run: uv python install

      - name: uv sync
        run: uv sync --frozen

      - name: ruff
        run: uv run ruff check .

      - name: django check
        run: uv run python manage.py check

      # Build the static manifest the same way the Docker image does
      # (CompressedManifestStaticFilesStorage). Fails the PR if any CSS
      # url()/@import can't be resolved/rewritten — catching that class of
      # static regression at PR time instead of only at deploy-build time.
      - name: collectstatic
        run: uv run python manage.py collectstatic --noinput

      - name: pytest
        run: uv run pytest -q
